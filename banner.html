<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner</title>

    <link rel="stylesheet" href="styles/banner.css" />
  </head>
  <body>
    <section class="banner global-padding">
      <div class="banner-content">
        <div class="banner-text">
          <div class="badge">
            <i class="fas fa-star"></i> All talents across the world
          </div>
          <h1>
            Create
            <span class="highlight-purple"
              >Short<span class="highlight-purple"><span>-</span>From</span
              ><br /><span class="highlight-static-purple">Video</span>
              <span class="highlight-purple">Content</span></span
            >
            starting at <span class="highlight-red">$99</span>/month.
          </h1>
          <p>
            Tailored social media content of the highest quality, crafted for
            your business. Shared on your channels only upon your approval.
          </p>
          <div class="btn-group">
            <button class="btn btn-primary">Get started</button>
            <button class="btn btn-secondary">Book a demo</button>
          </div>
        </div>
        <div class="banner-images">
          <img src="./images/banner-img.png" alt="Video 1" />
          <img src="./images/banner-img.png" alt="Video 2" />
        </div>
      </div>

      <div class="social-section">
        <div class="social-proof">
          <span>Social channel we work with</span>
          <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-facebook"></i>
            <i class="fab fa-x-twitter"></i>
            <i class="fab fa-youtube"></i>
            <i class="fab fa-linkedin"></i>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
